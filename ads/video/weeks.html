<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Video: your first 4 weeks</title>
<link rel="stylesheet" href="kit.css">
<style>
  .top-h { font-size: 70px; line-height: 1.08; font-weight: 800; letter-spacing: -0.03em; }
  .top-h i { font-family: 'Instrument', serif; font-weight: 400; color: var(--yellow); font-size: 1.2em; letter-spacing: 0; }
  .report { margin-top: 30px; background: #fff; color: var(--ink); border-radius: 48px; padding: 34px 38px 34px; box-shadow: 0 50px 90px -40px rgba(0, 0, 0, 0.75); }
  .match { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 26px; border-bottom: 2px solid var(--line); }
  .match .k { font-size: 23px; font-weight: 700; letter-spacing: 0.14em; color: var(--pink); }
  .match .v { margin-top: 6px; font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .match .v i { font-family: 'Instrument', serif; font-weight: 400; color: var(--pink); font-size: 1.18em; letter-spacing: 0; }
  .match .ex { flex: none; background: #faf6f8; color: var(--muted); border-radius: 999px; padding: 9px 20px; font-size: 23px; font-weight: 700; }
  .stops { margin-top: 28px; display: flex; flex-direction: column; gap: 26px; }
  .stop { display: grid; grid-template-columns: 150px 1fr; column-gap: 26px; align-items: start; }
  .stop .wk { margin-top: 4px; background: var(--tint); color: var(--pink); border-radius: 999px; padding: 10px 0; text-align: center; font-size: 28px; font-weight: 800; }
  .stop .ttl { font-size: 47px; font-weight: 800; letter-spacing: -0.028em; line-height: 1.12; }
  .stop .ln { margin-top: 6px; font-size: 33px; font-weight: 500; color: var(--muted); line-height: 1.28; }
  .note { margin-top: 26px; font-size: 23px; font-weight: 500; color: #a892ab; text-align: center; }
  .plates { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; width: 100%; }
  .plates img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 40px; display: block; }
</style>
<body>
  <div class="stage">
    <span class="glow" style="width:760px;height:760px;right:-300px;bottom:-260px;background:#c2185b;opacity:.4"></span>

    <div class="scene mid" data-in="-1" data-out="2.7">
      <div class="h" data-en="The diet for your type." data-hi="Aapke type ki diet."></div>
      <div class="acc" style="margin-top:14px" data-in="1.0" data-en="Your first 4 weeks." data-hi="Pehle 4 hafte."></div>
    </div>

    <div class="scene" data-in="2.7" data-out="11.6" data-dy="0" style="padding-bottom:540px">
      <div class="top-h" data-en="Your first <i>4 weeks</i>" data-hi="Aapke pehle <i>4 hafte</i>"></div>
      <div class="report">
        <div class="match">
          <div>
            <div class="k">YOUR SYMPTOMS MATCH</div>
            <div class="v">Insulin-resistant <i>PCOS type</i></div>
          </div>
          <span class="ex">Sample report</span>
        </div>
        <div class="stops">
          <div class="stop" data-in="3.2"><span class="wk" data-en="Week 1" data-hi="Hafta 1"></span><div><div class="ttl" data-en="The cravings let go" data-hi="Cravings chhoot jaati hain"></div><div class="ln" data-en="The hunt for something sweet after meals stops." data-hi="Khane ke baad meetha dhoondhna band."></div></div></div>
          <div class="stop" data-in="5.1"><span class="wk" data-en="Week 2" data-hi="Hafta 2"></span><div><div class="ttl" data-en="Your clothes stop fighting you" data-hi="Kapde aaram se aane lagte hain"></div><div class="ln" data-en="The waistband that dug in all day loosens." data-hi="Din bhar chubhne wala waistband dheela hota hai."></div></div></div>
          <div class="stop" data-in="7.0"><span class="wk" data-en="Week 3" data-hi="Hafta 3"></span><div><div class="ttl" data-en="Your skin starts to clear" data-hi="Skin saaf hone lagti hai"></div><div class="ln" data-en="Less concealer. Fewer days you want to hide your face." data-hi="Kam concealer. Chehra chhupane wale din kam."></div></div></div>
          <div class="stop" data-in="8.9"><span class="wk" data-en="Week 4" data-hi="Hafta 4"></span><div><div class="ttl" data-en="You stop hiding" data-hi="Aap chhupna band karti hain"></div><div class="ln" data-en="No more standing at the back in photos." data-hi="Photos mein peeche khade hona band."></div></div></div>
        </div>
      </div>
      <div class="note">What many women notice on a plan like this. Every body moves at its own pace.</div>
    </div>

    <div class="scene mid" data-in="11.6" data-out="14.4">
      <div class="plates">
        <img src="../../public/img/thali.jpg" alt="" data-in="11.8" data-s="0.9">
        <img src="../../public/img/dosa.jpg" alt="" data-in="12.0" data-s="0.9">
        <img src="../../public/img/leaf.jpg" alt="" data-in="12.2" data-s="0.9">
      </div>
      <div class="h" style="margin-top:56px;font-size:96px" data-in="12.1" data-en="With roti, rice and dosa." data-hi="Roti, chawal, dosa ke saath."></div>
      <div class="acc" style="margin-top:10px" data-in="12.6" data-en="Plans from ₹199." data-hi="Sirf ₹199 se."></div>
    </div>

    <div class="end" data-in="14.4" data-dy="0" style="background:none">
      <div class="logo" data-in="14.6">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="#C2185B"/><path d="M9 23.5c0-8.5 5.5-13.5 14.5-14.5 0 9.5-5.5 14.5-14.5 14.5z" fill="#fff"/><path d="M9.5 23c3-4.2 6.2-7.2 10.5-9.5" fill="none" stroke="#C2185B" stroke-width="1.8" stroke-linecap="round"/><circle cx="23.5" cy="23" r="2.6" fill="#FFD23F"/></svg>
        <span>fitovela</span>
      </div>
      <div class="m" data-in="14.8" data-en="Get your free report." data-hi="Apni free report paayein."></div>
      <div class="a" data-in="15.0" data-en="2 minutes." data-hi="2 minute."></div>
      <div class="pill" data-in="15.3" data-s="0.9" data-en="Take the free check" data-hi="Free check shuru karein"></div>
      <div class="fine" data-in="15.5" data-dy="0">A symptom assessment, not a medical diagnosis.</div>
    </div>
  </div>
  <script>window.DURATION = 17.6;</script>
  <script src="kit.js"></script>
</body>
</html>
